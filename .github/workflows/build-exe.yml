name: Build standalone executable

# WHY THIS WORKFLOW EXISTS
#
# PyInstaller cannot cross-compile. A Windows .exe must be built on Windows, a
# macOS binary on macOS. This produces the Windows and Linux onedir bundles
# for ArtificeTranscribe from apps/artifice-transcribe/artifice-transcribe.spec.
#
# The bundle is CORE-ONLY: the ASR stack (whisperx, torch, pyannote,
# transformers) is excluded by the spec itself (see the spec's own comment) —
# a frozen executable cannot pip-install into its own bundled interpreter, so
# ASR is an opt-in the user installs separately. Do not add `--extra asr` /
# `asr-cuda` to the sync step below; it would not change what ships (the spec
# excludes it regardless) and would only slow the build down.
#
# macOS is deliberately ABSENT. A macOS binary cannot be opened by an ordinary
# user without notarisation — they would have to run
# `xattr -r -d com.apple.quarantine` by hand. Producing an unsigned .app that
# most Mac users cannot launch would look like support and would not be.
# Add macOS here at the same time as signing and notarisation, not before.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

# The build job only checks out, builds, and uploads a workflow artifact
# (upload-artifact needs no elevated token scope) — read-only is sufficient.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # a Windows failure should not hide a Linux success
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the app and PyInstaller
        # transcribe-window adds pywebview, so the frozen app opens its own
        # window (closing it quits) instead of leaving a browser tab and a
        # process that can only be ended from Task Manager.
        run: uv sync --extra transcribe-window

      - name: Gate on the core API/e2e workflow
        # A failing core workflow must produce no distributable bundle.
        run: uv run pytest -q apps/artifice-transcribe/tests/test_api_e2e.py apps/artifice-transcribe/tests/test_capabilities.py

      - name: Freeze
        # Run from the repo root — the spec resolves paths relative to it, and
        # collect_data_files() needs the workspace packages importable.
        run: uv run --with pyinstaller pyinstaller --clean --noconfirm apps/artifice-transcribe/artifice-transcribe.spec

      - name: Smoke-test the built binary (Linux)
        if: runner.os == 'Linux'
        # Tests cannot see packaging bugs: they run against src/, while the bug
        # lives only in the artifact. So exercise the ARTIFACT over HTTP, and
        # assert on an asset that resolves via importlib.resources from the
        # shared package. /api/v1/capabilities is cheap and answers 200 with
        # no ASR stack installed — exactly what this core-only bundle carries.
        run: |
          BINARY="./dist/artifice-transcribe/artifice-transcribe"
          # CI is headless, so the window cannot be opened here; check that
          # pywebview shipped, since without it the app has no window to close.
          test -d ./dist/artifice-transcribe/_internal/webview \
            && echo "  pywebview bundled: yes" \
            || { echo "  pywebview bundled: NO"; exit 1; }
          setsid nohup "$BINARY" --port 18999 --no-window > /tmp/exe.log 2>&1 < /dev/null &
          sleep 12
          fail=0
          for path in / /api/v1/capabilities /shared/tokens.css /static/css/app.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18999$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          curl -s http://127.0.0.1:18999/ | grep -q app-shell \
            && echo "  shared app shell rendered: yes" \
            || { echo "  shared app shell MISSING"; fail=1; }
          pkill -f "dist/artifice-transcribe" || true
          echo "--- server log ---"; head -20 /tmp/exe.log
          exit $fail

      - name: Smoke-test the built binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Never merge native stderr with 2>&1 in PowerShell — it corrupts
        # error handling and $LASTEXITCODE. Start-Process, not `&`, so the
        # server does not hold this step open.
        run: |
          $exe = ".\dist\artifice-transcribe\artifice-transcribe.exe"
          if (-not (Test-Path $exe)) { Write-Error "no binary at $exe"; exit 1 }
          # CI is headless, so the window cannot be opened here; check that
          # pywebview shipped, since without it the app has no window to close.
          if (-not (Test-Path ".\dist\artifice-transcribe\_internal\webview")) {
            Write-Host "  pywebview bundled: NO"; exit 1
          }
          Write-Host "  pywebview bundled: yes"
          Write-Host "binary size: $((Get-Item $exe).Length) bytes"
          $stdoutLog = "artifice-transcribe-stdout.log"
          $stderrLog = "artifice-transcribe-stderr.log"
          $p = Start-Process -FilePath $exe -ArgumentList @("--no-window","--port","18999") -PassThru `
            -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          Start-Sleep -Seconds 20
          Write-Host "process HasExited: $($p.HasExited)"
          if ($p.HasExited) { Write-Host "process ExitCode: $($p.ExitCode)" }
          $fail = 0
          foreach ($path in @("/","/api/v1/capabilities","/shared/tokens.css","/static/css/app.css")) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18999$path" -UseBasicParsing -TimeoutSec 15
              Write-Host "  $path -> $($r.StatusCode)"
              if ($r.StatusCode -ne 200) { $fail = 1 }
            } catch {
              Write-Host "  $path -> FAILED"
              $fail = 1
            }
          }
          try {
            $body = (Invoke-WebRequest -Uri "http://127.0.0.1:18999/" -UseBasicParsing -TimeoutSec 15).Content
            if ($body -match "app-shell") { Write-Host "  shared app shell rendered: yes" }
            else { Write-Host "  shared app shell MISSING"; $fail = 1 }
          } catch { Write-Host "  index fetch FAILED"; $fail = 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($fail -ne 0) {
            Write-Host "--- stdout ---"; Get-Content $stdoutLog -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content $stderrLog -ErrorAction SilentlyContinue
          }
          exit $fail

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: artifice-transcribe-${{ runner.os }}
          path: |
            dist/artifice-transcribe/
          if-no-files-found: error
          retention-days: 30

  # Attach the frozen bundles to the GitHub Release, on tags only.
  #
  # This is a separate job rather than extra steps on `build` for a reason:
  # the build job runs a PyInstaller freeze of third-party code and is
  # deliberately held to `contents: read` — it must not carry a write-capable
  # token while executing arbitrary build tooling. Only this job, which does
  # nothing but archive already-built artifacts and upload them, holds
  # `contents: write`, and only at the job level.
  attach-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # download-artifact needs this once job-level perms zero the defaults

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Archive each bundle into a single release asset
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"
          cd "$GITHUB_WORKSPACE"

          for os in Linux Windows; do
            (
              cd "dist/artifice-transcribe-$os"
              if [ "$os" = "Linux" ]; then
                # Artifact transfer drops the executable bit; without this the
                # extracted ./artifice-transcribe says "Permission denied".
                chmod +x ./artifice-transcribe
                tar -czf "$GITHUB_WORKSPACE/artifice-transcribe-Linux-$VER.tar.gz" .
              else
                zip -qr "$GITHUB_WORKSPACE/artifice-transcribe-Windows-$VER.zip" .
              fi
            )
          done

          ls -l "$GITHUB_WORKSPACE"

      - name: Upload assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repository, so `gh` has no git
          # remote to infer it from ("not a git repository").
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"

          # The Release may be created by a separate release workflow on the
          # same tag with no ordering guarantee, or may not exist at all for
          # this repo yet — create it if missing, then upload onto it.
          if ! gh release view "$VER" >/dev/null 2>&1; then
            gh release create "$VER" --title "$VER" --generate-notes
          fi

          gh release upload "$VER" \
            "artifice-transcribe-Linux-$VER.tar.gz" \
            "artifice-transcribe-Windows-$VER.zip" \
            --clobber
